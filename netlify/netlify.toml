# Netlify configuration for Vite React project
[build]
  publish = "dist"
  command = "npm run build"

[dev]
  command = "npm run dev"
  port = 5173

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.fullstackdev.cz/*"
  to = "https://fullstackdev.cz/:splat"
  status = 301
  force = true

# Redirect all requests to index.html for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
