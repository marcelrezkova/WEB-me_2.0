<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Open Graph image source (1200x630). Render at exactly 1200x630 and save as public/og-image.png. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #05060a; }
    body {
      position: relative;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: #f2f4f8;
    }
    /* soft accent glow and a faint node field, echoing the hero particle network */
    .glow {
      position: absolute; width: 720px; height: 720px; right: -220px; top: -260px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94,242,255,0.16) 0%, rgba(94,242,255,0) 65%);
    }
    .nodes { position: absolute; right: 60px; top: 70px; opacity: 0.55; }
    .content {
      position: absolute; left: 96px; right: 96px; top: 0; bottom: 0;
      display: flex; flex-direction: column; justify-content: center;
    }
    .hairline { width: 96px; height: 2px; background: #5ef2ff; margin-bottom: 36px; box-shadow: 0 0 12px rgba(94,242,255,0.6); }
    .name {
      font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 500;
      letter-spacing: 0.04em; color: #a6adbb; margin-bottom: 28px;
    }
    .name .dot { color: #5ef2ff; margin: 0 10px; }
    .name .role { color: #f2f4f8; }
    h1 {
      font-size: 72px; font-weight: 600; line-height: 1.06; letter-spacing: -0.02em;
      max-width: 900px;
    }
    h1 .accent { color: #5ef2ff; }
    .domain {
      position: absolute; left: 96px; bottom: 64px;
      font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #a6adbb;
      letter-spacing: 0.06em;
    }
    .domain::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5ef2ff; margin-right: 12px; vertical-align: middle; }
    .edge { position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: linear-gradient(90deg, rgba(94,242,255,0) 0%, rgba(94,242,255,0.5) 50%, rgba(94,242,255,0) 100%); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <svg class="nodes" width="360" height="300" viewBox="0 0 360 300" fill="none">
    <g stroke="#5ef2ff" stroke-opacity="0.35" stroke-width="1">
      <line x1="40" y1="60" x2="150" y2="30"/><line x1="150" y1="30" x2="260" y2="90"/>
      <line x1="40" y1="60" x2="120" y2="150"/><line x1="120" y1="150" x2="260" y2="90"/>
      <line x1="260" y1="90" x2="330" y2="190"/><line x1="120" y1="150" x2="210" y2="240"/>
      <line x1="210" y1="240" x2="330" y2="190"/><line x1="150" y1="30" x2="120" y2="150"/>
    </g>
    <g fill="#5ef2ff">
      <circle cx="40" cy="60" r="3"/><circle cx="150" cy="30" r="4"/><circle cx="260" cy="90" r="5"/>
      <circle cx="120" cy="150" r="3.5"/><circle cx="330" cy="190" r="3"/><circle cx="210" cy="240" r="4"/>
    </g>
  </svg>
  <div class="content">
    <div class="hairline"></div>
    <div class="name">Marcela Řezková<span class="dot">·</span><span class="role">AI Engineer</span></div>
    <h1>I design products and build them with <span class="accent">AI agents.</span></h1>
  </div>
  <div class="domain">fullstackdev.cz</div>
  <div class="edge"></div>
</body>
</html>
